name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # The npm release.yml publishes with, so a test can't pass here and fail there
      - run: npm install -g npm@12
      - run: npm ci
      # core's inventory of reason codes, for tests/rule-map.test.js, at the
      # version installed
      - run: git clone --depth 1 --branch "v$(node -p "require('@surea11y/core/package.json').version")" https://github.com/SureA11y/core.git ../core
      - run: npm test
